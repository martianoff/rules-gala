# Run by the Bazel Central Registry for every release: e2e/smoke uses
# rules_lean from another module (and through a second non-root module).
# Keep the oldest Bazel in sync with README.md and .github/workflows/ci.yml.
bcr_test_module:
  module_path: "e2e/smoke"
  matrix:
    platform:
      - debian11
      - ubuntu2204
      - ubuntu2004_arm64
      - macos
      - macos_arm64
      - windows
    bazel: ["7.4.1", "8.x", "9.x"]
  tasks:
    run_tests:
      name: "Run test module"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      test_targets:
        - "//..."
